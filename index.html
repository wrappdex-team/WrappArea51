    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy — enforcing mode.
      Placed before any resource loads so the policy is active from first byte.

      Directive inventory (each domain justified by codebase audit):

        script-src    — 'unsafe-inline' required for Vite modulepreload polyfill and
                        error-fallback onclick handler in main.tsx. External scripts:
                        changenow.io (stepper-connector.js), quantifycrypto.com
                        (heatmap/ticker widgets inside srcdoc iframes inherit parent CSP).

        style-src     — 'unsafe-inline' covers Tailwind utilities, inline style attrs,
                        and Dynamic SDK injected CSS. fonts.googleapis.com for Inter /
                        JetBrains Mono. app.dynamic.xyz for SDK legacy Safari styles.

        font-src      — fonts.gstatic.com (Google Fonts files), cdn.jsdelivr.net
                        (Dynamic SDK DM Sans @font-face), data: for inline font URIs.

        img-src       — Supabase storage (partnered logos signed URLs),
                         coingecko / saucerswap / 1inch / coinmarketcap token icons,
                         coin-images.coingecko.com (CoinGecko CDN migration target),
                         changenow logo, Dynamic SDK assets, WC explorer wallet icons
                         (explorer-api.walletconnect.com serves getWalletImage),
                         quantifycrypto widget images (bare + www + wildcard subdomains),
                         *.digitaloceanspaces.com (LiveCoinWatch CDN — all regions —
                         used by quantifycrypto ticker widget coin logos),
                         *.livecoinwatch.com (LCW direct CDN fallback),
                         images.unsplash.com (team hero photo),
                         avatars.githubusercontent.com (partner logos via GitHub),
                         www.google.com (favicon fallback for partner logos),
                         altlantis.io (AltLantis partner logo),
                         data: SVGs, blob: canvas exports.

                        NOTE: The QC ticker/heatmap widgets are now served as
                        static HTML files in /public/widgets/ via src= iframes,
                        each with their own permissive <meta> CSP (img-src *).
                        This decouples them from the parent page's img-src entirely.
                        The wildcards above are retained as defense-in-depth.
        connect-src   — Supabase edge functions, SaucerSwap / CoinGecko / CoinCap /
                        Binance / Alternative.me APIs, Bonzo lending protocol,
                        Hedera mirror nodes + JSON-RPC relays (mainnet + testnet),
                        Ethereum RPCs (Chainlink price feeds), EVM RPCs (1inch),
                        WalletConnect infrastructure (.com + .org TLDs, WSS relay),
                        Dynamic Labs SDK + auth API, Farcaster relay,
                        quantifycrypto widget API (bare + wildcard subdomains),
                        DexScreener API (HBAR.h token price oracle — primary source).

        frame-src     — changenow.io (swap/topup widget), app.hashport.network
                        (HashPort bridge widget), studio.squidrouter.com (Squid/Axelar
                        cross-chain bridge iframe widget), WalletConnect verify iframes,
                        Dynamic SDK (passkey / secure-enclave iframes).

        worker-src    — blob: for WalletConnect / crypto library inline workers.

      Not expressible via meta tag (requires HTTP header for production):
        - frame-ancestors  (use X-Frame-Options or Vercel headers)
        - report-uri / report-to  (use Vercel headers + Sentry CSP endpoint)

      Rollout note: to monitor without blocking, temporarily change the
      http-equiv value to "Content-Security-Policy-Report-Only" and add a
      report-uri via server headers. Switch back to enforcing after validation.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://changenow.io https://quantifycrypto.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://app.dynamic.xyz; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://ehmlclowiedoqncymegi.supabase.co https://assets.coingecko.com https://coin-images.coingecko.com https://www.saucerswap.finance https://tokens.1inch.io https://s2.coinmarketcap.com https://changenow.io https://app.dynamic.xyz https://iconic.dynamic-static-assets.com https://dynamic-static-assets.com https://quantifycrypto.com https://www.quantifycrypto.com https://*.quantifycrypto.com https://lcw.nyc3.cdn.digitaloceanspaces.com https://*.digitaloceanspaces.com https://*.livecoinwatch.com https://explorer-api.walletconnect.com https://explorer.walletconnect.com https://images.unsplash.com https://avatars.githubusercontent.com https://www.google.com https://altlantis.io; connect-src 'self' https://ehmlclowiedoqncymegi.supabase.co https://api.saucerswap.finance https://api.alternative.me https://api.coingecko.com https://api.coincap.io https://rest.coincap.io https://api.binance.com https://mainnet-data-staging.bonzo.finance https://mainnet-public.mirrornode.hedera.com https://testnet.mirrornode.hedera.com https://mainnet.hashio.io https://testnet.hashio.io https://ethereum-rpc.publicnode.com https://rpc.ankr.com https://cloudflare-eth.com https://eth.llamarpc.com https://1rpc.io https://polygon-rpc.com https://bsc-dataseed1.binance.org https://arb1.arbitrum.io wss://relay.walletconnect.org https://relay.walletconnect.org wss://relay.walletconnect.com https://relay.walletconnect.com https://echo.walletconnect.com https://pulse.walletconnect.org https://rpc.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org https://explorer-api.walletconnect.com https://app.dynamic.xyz https://app.dynamicau
