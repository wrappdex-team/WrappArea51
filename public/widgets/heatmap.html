<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <!-- IMPLEMENTATION NOTE: Relaxed CSP — iframe sandbox provides isolation from parent page -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://quantifycrypto.com https://*.quantifycrypto.com; style-src 'unsafe-inline' https://quantifycrypto.com https://*.quantifycrypto.com https://fonts.googleapis.com; img-src * data: blob:; connect-src https://quantifycrypto.com https://*.quantifycrypto.com; font-src https://fonts.googleapis.com https://fonts.gstatic.com https://*.quantifycrypto.com; frame-src 'none'" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overflow: hidden;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
    *:not(html):not(body) {
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.10) transparent;
    }
    *:not(html):not(body)::-webkit-scrollbar { width: 4px; height: 4px; }
    *:not(html):not(body)::-webkit-scrollbar-track { background: transparent; }
    *:not(html):not(body)::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 2px; }
    *:not(html):not(body)::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.20); }
    *:not(html):not(body)::-webkit-scrollbar-corner { background: transparent; }
    qc-heatmap { display: block; width: 100%; }
  </style>
  <script>
    // Read theme from query param and apply background
    (function() {
      var params = new URLSearchParams(window.location.search);
      var theme = params.get('theme') === 'light' ? 'light' : 'dark';
      var bg = theme === 'dark' ? '#080a12' : '#f8fafc';
      document.documentElement.style.background = bg;
      document.addEventListener('DOMContentLoaded', function() {
        document.body.style.background = bg;
      });
    })();
  </script>
</head>
<body>
  <qc-heatmap
    height="400px"
    num-of-coins="50"
    currency-code="USD">
  </qc-heatmap>
  <script src="https://quantifycrypto.com/widgets/heatmaps/js/qc-heatmap-widget.js"></script>
</body>
</html>
